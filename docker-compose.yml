services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tarnished
      POSTGRES_PASSWORD: tarnished
      POSTGRES_DB: tarnished
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
