services:
  web:

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: tarnished
      POSTGRES_PASSWORD: tarnished
      POSTGRES_DB: tarnished
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
