services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tarnished
      POSTGRES_PASSWORD: tarnished
      POSTGRES_DB: tarnished
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarnished -d tarnished"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: tarnished
      PGPASSWORD: tarnished
      PGDATABASE: tarnished
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    command: ["sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      API_BASE_URL: http://api:8000
      HF_TOKEN: ${HF_TOKEN}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: celery -A app.celery.celery_app worker -Q discovery,scraping -c 2
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      API_BASE_URL: http://api:8000
      HF_TOKEN: ${HF_TOKEN}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  pgdata:
